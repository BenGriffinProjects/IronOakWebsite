<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Oak</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #2f4f2f;
            color: white;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        header h2 {
            font-size: 1.4rem;
            font-weight: normal;
        }

        .ribbon-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 60px;
            padding: 20px;
        }

        .ribbon {
            width: 250px;
            padding: 25px;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px;
            transition: transform 0.2s ease;
        }

        .ribbon:hover {
            transform: scale(1.05);
        }

        .buy-labels {
            background-color: #d35400;
        }

        .about-us {
            background-color: #2980b9;
        }

        .contact {
            background-color: #8e44ad;
        }

        footer {
            margin-top: 80px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Iron Oak</h1>
        <h2>Industrial Labels, Tags, and Signs</h2>
    </header>

    <div class="ribbon-container">
        <a href="buy-labels.html" class="ribbon buy-labels">
            Buy Labels
        </a>

        <a href="about-us.html" class="ribbon about-us">
            About Us
        </a>

        <a href="contact.html" class="ribbon contact">
            Contact
        </a>
    </div>

    <footer>
        © 2026 Iron Oak
    </footer>

</body>
</html>
